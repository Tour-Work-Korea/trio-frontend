name: Deploy Nangman Trips

on:
  push:
    branches: [main]
    paths:
      - 'apps/trips/**'
      - '.github/workflows/deploy-trips.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-nangman-trips-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      S3_TARGET: s3://ddakji-react-apps/app-trips
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Test travel data and deployment isolation
        run: node --test apps/trips/src/tests/*.test.mjs apps/trips/scripts/*.test.mjs
      - name: Build only Nangman Trips
        run: node node_modules/vite/bin/vite.js build --config apps/trips/vite.config.mjs
      - name: Verify owned output and browser bundle
        run: |
          node apps/trips/scripts/verify-output.mjs apps/trips/dist
          node scripts/verify-web-bundle.mjs apps/trips/dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590052531747:role/github-actions-workaway-ios-prod
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload assets to dedicated origin prefix
        run: |
          aws s3 sync apps/trips/dist/trips-assets/ "$S3_TARGET/trips-assets/" --exclude 'build/*' --cache-control 'no-cache'
          aws s3 sync apps/trips/dist/trips-assets/build/ "$S3_TARGET/trips-assets/build/" --cache-control 'public,max-age=31536000,immutable'
      - name: Publish only travel pages
        run: aws s3 sync apps/trips/dist/trips/ "$S3_TARGET/trips/" --cache-control 'no-cache'
      - name: Invalidate only travel routes
        run: aws cloudfront create-invalidation --distribution-id E2RF8PPEXW3Y9R --paths '/trips' '/trips/*' '/trips-assets/*'

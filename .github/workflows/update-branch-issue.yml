name: Update branch issue after develop merge

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read
  pull-requests: read
  issues: write

# Reconcile all merged PRs for this branch, including an intermediate queued run.
concurrency:
  group: branch-issue-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  update-issue:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Update matching issue
        uses: actions/github-script@v7
        with:
          script: |
            const updateIssue = require('./.github/scripts/update-branch-issue.cjs');
            await updateIssue({github, context, core});

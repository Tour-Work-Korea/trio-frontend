name: Deploy App Web

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/web/**'
      - 'packages/app/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/*web*.mjs'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-app-web-${{ github.ref_name }}
  # Finish uploads before another run reads the last successful deployment.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET: ddakji-react-apps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine deployment target
        id: target
        run: |
          case "${GITHUB_REF_NAME}" in
            develop)
              echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
              echo "DEPLOY_ENV=dev" >> "$GITHUB_ENV"
              echo "S3_PREFIX=app-dev" >> "$GITHUB_ENV"
              echo "SSM_BASE_PATH=/workaway/dev/android" >> "$GITHUB_ENV"
              ;;
            main)
              echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
              echo "DEPLOY_ENV=prod" >> "$GITHUB_ENV"
              echo "S3_PREFIX=app" >> "$GITHUB_ENV"
              echo "SSM_BASE_PATH=/workaway/prod/android" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported branch for web deployment: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials (DEV)
        if: steps.target.outputs.deploy_env == 'dev'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590052531747:role/github-actions-workaway-ios-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (PROD)
        if: steps.target.outputs.deploy_env == 'prod'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590052531747:role/github-actions-workaway-ios-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Determine changed deployment scope
        id: scope
        run: |
          aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}/web-deployment.json" /tmp/web-deployment.json --only-show-errors || echo "No readable deployment state; using a full release."
          SCOPE=$(node scripts/web-deploy-scope.mjs /tmp/web-deployment.json)
          echo "value=$SCOPE" >> "$GITHUB_OUTPUT"
          echo "Deployment scope: $SCOPE"
          echo "### Deployment scope: $SCOPE" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Test KODA and deployment boundaries
        run: node --test scripts/web-deploy-scope.test.mjs apps/web/src/features/koda/tests/*.test.mjs

      - name: Load web env from AWS SSM
        run: |
          {
            echo "API_BASE_URL=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/API_BASE_URL" --with-decryption --query Parameter.Value --output text)"
            echo "WEB_BASE_URL=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/WEB_BASE_URL" --with-decryption --query Parameter.Value --output text)"
            echo "KAKAO_JS_KEY=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/KAKAO_JS_KEY" --with-decryption --query Parameter.Value --output text)"
            echo "KAKAO_NATIVEAPP_KEY=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/KAKAO_NATIVEAPP_KEY" --with-decryption --query Parameter.Value --output text)"
            echo "KAKAO_RESTAPI_KEY=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/KAKAO_RESTAPI_KEY" --with-decryption --query Parameter.Value --output text)"
            echo "KAKAO_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/KAKAO_CLIENT_ID" --with-decryption --query Parameter.Value --output text)"
            echo "KAKAO_REDIRECT_URI=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/KAKAO_REDIRECT_URI" --with-decryption --query Parameter.Value --output text)"
            echo "GOOGLE_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/GOOGLE_CLIENT_ID" --with-decryption --query Parameter.Value --output text)"
            echo "GOOGLE_IOS_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/GOOGLE_IOS_CLIENT_ID" --with-decryption --query Parameter.Value --output text)"
            echo "NAVER_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/NAVER_CLIENT_ID" --with-decryption --query Parameter.Value --output text)"
            echo "NAVER_CLIENT_SECRET=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/NAVER_CLIENT_SECRET" --with-decryption --query Parameter.Value --output text)"
            echo "NAVER_REDIRECT_URI=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/NAVER_REDIRECT_URI" --with-decryption --query Parameter.Value --output text)"
            echo "NAVER_SEARCH_CLIENT_ID=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/NAVER_SEARCH_CLIENT_ID" --with-decryption --query Parameter.Value --output text)"
            echo "NAVER_SEARCH_CLIENT_SECRET=$(aws ssm get-parameter --name "${SSM_BASE_PATH}/NAVER_SEARCH_CLIENT_SECRET" --with-decryption --query Parameter.Value --output text)"
          } > .env
          echo "Web environment file created from AWS SSM for ${DEPLOY_ENV}."

      - name: Build shared web app
        if: steps.scope.outputs.value == 'full'
        run: KODA_DEPLOY_TARGET="$DEPLOY_ENV" npm exec --workspace @trio/web -- vite build --config vite.koda.config.js --outDir dist

      - name: Build isolated KODA web app
        run: |
          KODA_DEPLOY_TARGET="$DEPLOY_ENV" KODA_BUILD_SCOPE=koda npm exec --workspace @trio/web -- vite build --config vite.koda.config.js --outDir dist-koda
          node scripts/prepare-koda-web.mjs apps/web/dist-koda

      - name: Verify KODA build output
        run: node scripts/verify-web-bundle.mjs apps/web/dist-koda

      - name: Assemble and verify full release
        if: steps.scope.outputs.value == 'full'
        run: |
          cp -R apps/web/dist-koda/. apps/web/dist/
          node scripts/verify-web-bundle.mjs apps/web/dist

      - name: Upload immutable KODA assets first
        run: |
          aws s3 sync apps/web/dist-koda/koda-assets/build/ "s3://${S3_BUCKET}/${S3_PREFIX}/koda-assets/build/" --cache-control "public,max-age=31536000,immutable"

      - name: Upload full web release
        if: steps.scope.outputs.value == 'full'
        run: |
          aws s3 sync apps/web/dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" --delete --exclude "koda-assets/build/*" --exclude "koda/entry.js" --cache-control "no-cache"

      - name: Upload only KODA pages and media
        if: steps.scope.outputs.value == 'koda'
        run: |
          # Validated allowlist; never upload/delete root index.html or shared assets.
          aws s3 sync apps/web/dist-koda/ "s3://${S3_BUCKET}/${S3_PREFIX}/" --exclude "koda-assets/build/*" --exclude "koda/entry.js" --cache-control "no-cache"

      - name: Publish current KODA runtime
        run: |
          aws s3 cp apps/web/dist-koda/koda/entry.js "s3://${S3_BUCKET}/${S3_PREFIX}/koda/entry.js" --content-type "application/javascript" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          if [ "${DEPLOY_ENV}" = "dev" ]; then
            DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_APP_DEV }}"
          else
            DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_APP_PROD }}"
          fi

          if [ -z "$DIST_ID" ]; then
            echo "CloudFront distribution ID secret is not set for ${DEPLOY_ENV}."
            exit 1
          fi

          if [ "${{ steps.scope.outputs.value }}" = "koda" ]; then
            INVALIDATION_PATHS=("/koda*" "/language-exchange*")
          else
            INVALIDATION_PATHS=("/*")
          fi

          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "${INVALIDATION_PATHS[@]}"

      - name: Record successful deployment
        run: |
          node -e 'require("fs").writeFileSync("/tmp/web-deployment-next.json", JSON.stringify({schema: 1, commit: process.env.GITHUB_SHA}))'
          aws s3 cp /tmp/web-deployment-next.json "s3://${S3_BUCKET}/${S3_PREFIX}/web-deployment.json" --content-type "application/json" --cache-control "no-cache"

      - name: Notify Discord (Web)
        if: ${{ always() && !cancelled() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            ENV_NAME="🧪 DEV"
          else
            ENV_NAME="🚀 PROD"
          fi

          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            MSG="🌐 Web 배포 성공"
          else
            COLOR=15158332
            MSG="❌ Web 배포 실패"
          fi

          curl --fail-with-body \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"$MSG\",
                \"description\": \"환경: $ENV_NAME\\n브랜치: ${GITHUB_REF_NAME}\\n작성자: ${{ github.actor }}\\n링크: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"color\": $COLOR
              }]
            }" \
            "$DISCORD_WEBHOOK_URL"

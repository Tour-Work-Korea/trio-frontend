buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        kakaoSdkVersion = "2.25.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.3")
        classpath("com.google.firebase:firebase-crashlytics-gradle:2.9.9")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repository.map.naver.com/archive/maven"
        }
    }

    configurations.configureEach { configuration ->
        configuration.exclude group: "com.kakao.sdk", module: "v2-story"

        resolutionStrategy.eachDependency { details ->
            if (
                details.requested.group == "com.kakao.sdk" &&
                details.requested.name.startsWith("v2-") &&
                details.requested.name != "v2-story"
            ) {
                details.useVersion rootProject.ext.kakaoSdkVersion
                details.because "Kakao Android SDK 2.24.0 and below require a security update."
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
